<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A4D"/>
      <stop offset="100%" stop-color="#E84B00"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1a17"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </linearGradient>
    <clipPath id="sclip">
      <text x="90" y="128" font-family="'Arial Black', Impact, sans-serif" font-weight="900"
            font-size="120" text-anchor="middle">S</text>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="url(#bg)"/>
  <!-- S letterform filled orange -->
  <text x="90" y="128" font-family="'Arial Black', Impact, sans-serif" font-weight="900"
        font-size="120" text-anchor="middle" fill="url(#orange)">S</text>
  <!-- Basketball seam arcs clipped to the S -->
  <g clip-path="url(#sclip)" opacity="0.35">
    <circle cx="90" cy="90" r="74" fill="none" stroke="#0a0807" stroke-width="5"/>
    <path d="M16 90 Q90 48 164 90" fill="none" stroke="#0a0807" stroke-width="5"/>
    <path d="M16 90 Q90 132 164 90" fill="none" stroke="#0a0807" stroke-width="5"/>
    <path d="M90 16 Q52 90 90 164" fill="none" stroke="#0a0807" stroke-width="5"/>
  </g>
  <!-- Subtle outer glow ring -->
  <circle cx="90" cy="90" r="82" fill="none" stroke="#FF5C1A" stroke-width="1" opacity="0.15"/>
</svg>
