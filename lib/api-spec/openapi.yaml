openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: users
    description: User profile operations
  - name: health
    description: Health operations
  - name: players
    description: Player operations
  - name: teams
    description: Team / season operations
  - name: games
    description: Game operations
  - name: import
    description: Bulk data import
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: billing
    description: Subscription plan status and Stripe checkout/portal.
paths:
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get the current user's stored profile (name, etc.)
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update the current user's stored profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    delete:
      operationId: deleteMyAccount
      tags: [users]
      summary: Permanently delete the current user's account and stored application data
      description: Does not cancel active StoreKit or Stripe subscriptions.
      responses:
        "204":
          description: Account deleted

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /players/{playerId}:
    parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get a player
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Delete a player
      responses:
        "204":
          description: Deleted

  /players/{playerId}/summary:
    parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPlayerSummary
      tags: [players]
      summary: Career totals and averages for a player
      responses:
        "200":
          description: Player career summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSummary"

  /players/{playerId}/teams:
    parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listPlayerTeamGroups
      tags: [players]
      summary: Teams/seasons a player has games in, with per-team record and totals
      responses:
        "200":
          description: List of team/season groups for the player
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerTeamGroup"

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams/seasons
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team/season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{teamId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team/season
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team/season
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team/season (and its games)
      responses:
        "204":
          description: Deleted

  /teams/{teamId}/games:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listTeamGames
      tags: [games]
      summary: List games for a team/season (includes all players' stat lines)
      responses:
        "200":
          description: List of games with player stat lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"

  /games:
    get:
      operationId: listAllGames
      tags: [games]
      summary: List all games across all teams for the authenticated user
      responses:
        "200":
          description: List of games with player stat lines (all teams combined)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Create a game with per-player stat lines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameInput"
      responses:
        "201":
          description: Created game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{gameId}:
    parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getGame
      tags: [games]
      summary: Get a single game with all player stat lines
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game and its per-player stat lines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameUpdate"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
    delete:
      operationId: deleteGame
      tags: [games]
      summary: Delete a game
      responses:
        "204":
          description: Deleted

  /teams/{teamId}/highlight:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getTeamHighlight
      tags: [teams]
      summary: Get the season highlight reel status for a team
      responses:
        "200":
          description: Season highlight reel status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighlightStatus"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: generateTeamHighlight
      tags: [teams]
      summary: Start generating a combined season highlight reel for a team
      description: |
        Kicks off asynchronous server-side generation of one MP4 that
        concatenates the good-play moments from every game recorded for the
        team (in date order), each with an on-screen caption.
      responses:
        "202":
          description: Generation started (or already in progress)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighlightStatus"
        "400":
          description: Not eligible (no videos or no qualifying moments across the team's games)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /games/{gameId}/highlight:
    parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getGameHighlight
      tags: [games]
      summary: Get the highlight reel status for a game
      responses:
        "200":
          description: Highlight reel status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighlightStatus"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: generateGameHighlight
      tags: [games]
      summary: Start generating a highlight reel for a game
      description: |
        Kicks off asynchronous server-side generation of an MP4 highlight reel
        from the game's recorded video, including only made shots, rebounds,
        assists, steals and blocks, with an on-screen caption per moment.
      responses:
        "202":
          description: Generation started (or already in progress)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighlightStatus"
        "400":
          description: Not eligible (no video or no qualifying moments)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /games/{gameId}/lowlight:
    parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getGameLowlight
      tags: [games]
      summary: Get the lowlight reel status for a game
      responses:
        "200":
          description: Lowlight reel status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LowlightStatus"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: generateGameLowlight
      tags: [games]
      summary: Start generating a lowlight reel for a game
      description: |
        Kicks off asynchronous server-side generation of an MP4 lowlight reel
        from the game's recorded video, including only missed shots and
        turnovers, with an on-screen caption per moment.
      responses:
        "202":
          description: Generation started (or already in progress)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LowlightStatus"
        "400":
          description: Not eligible (no video or no qualifying moments)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Game not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /games/merge:
    post:
      operationId: mergeGames
      tags: [games]
      summary: Merge multiple partial games into one
      description: |
        Combines 2–10 games recorded on the same team into a single game record.
        Stats are summed per player across all games; game events are moved to
        the primary game with video timestamps adjusted for each game's recording
        length. Secondary games are hidden from listings but not deleted.
        If any games have recorded video, the videos are concatenated in
        chronological order as a background job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeGamesInput"
      responses:
        "200":
          description: The merged (primary) game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid request (games on different teams, already merged, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: One or more games not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /import:
    post:
      operationId: importData
      tags: [import]
      summary: Bulk import players, teams, games and stat lines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import result summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get the caller's current plan and subscription status
      responses:
        "200":
          description: Current plan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"

  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe Checkout session to start/upgrade a Pro subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutSessionInput"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Invalid price selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /billing/portal:
    post:
      operationId: createBillingPortalSession
      tags: [billing]
      summary: Create a Stripe Billing Portal session for the caller to manage their subscription
      responses:
        "200":
          description: Billing portal session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSessionResponse"
        "404":
          description: No Stripe customer exists for this account yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    UserProfile:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: ["string", "null"] }
        lastName: { type: ["string", "null"] }

    UserProfileUpdate:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Player:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        # Premium: player tracking reference photo stored in object storage.
        # photoUpdatedAt is server-set; use it to enforce the 6-month freshness rule.
        photoObjectPath: { type: string, nullable: true }
        photoUpdatedAt: { type: string, format: date-time, nullable: true }

    PlayerInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }

    PlayerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        # Set to the object path returned by the upload URL endpoint.
        # Server sets photoUpdatedAt automatically when this is provided.
        photoObjectPath: { type: string, nullable: true }

    PlayerSummary:
      type: object
      required:
        - playerId
        - playerName
        - plan
        - seasonScope
        - games
        - wins
        - losses
        - points
        - rebounds
        - assists
        - steals
        - turnovers
        - blocks
        - ftMade
        - ftAttempted
        - twoMade
        - twoAttempted
        - threeMade
        - threeAttempted
        - ppg
        - rpg
        - apg
        - spg
        - topg
        - bpg
      properties:
        playerId: { type: integer }
        playerName: { type: string }
        # "free" accounts only ever see current-season data, and never see
        # shooting-efficiency percentages (fgPct/threePct/ftPct) -- both are
        # Pro-only per Task #18. The frontend uses these to render upgrade
        # prompts; the server is the actual (authoritative) enforcement.
        plan: { type: string, enum: [free, pro, premium] }
        seasonScope: { type: string, enum: [current, career] }
        games: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        points: { type: integer }
        rebounds: { type: integer }
        assists: { type: integer }
        steals: { type: integer }
        turnovers: { type: integer }
        blocks: { type: integer }
        ftMade: { type: integer }
        ftAttempted: { type: integer }
        twoMade: { type: integer }
        twoAttempted: { type: integer }
        threeMade: { type: integer }
        threeAttempted: { type: integer }
        ppg: { type: number }
        rpg: { type: number }
        apg: { type: number }
        spg: { type: number }
        topg: { type: number }
        bpg: { type: number }
        # Only present for Pro accounts (shooting-efficiency gauges are Pro-only).
        fgPct: { type: number }
        threePct: { type: number }
        ftPct: { type: number }

    PlayerTeamGroup:
      type: object
      required: [teamId, teamName, games, wins, losses]
      properties:
        teamId: { type: integer }
        teamName: { type: string }
        games: { type: integer }
        wins: { type: integer }
        losses: { type: integer }

    Team:
      type: object
      required: [id, name, sport, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        sport: { type: string, default: basketball }
        createdAt: { type: string, format: date-time }

    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        sport: { type: string, enum: [basketball, soccer], default: basketball }

    TeamUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        sport: { type: string, enum: [basketball, soccer] }

    PlayerGameStatLine:
      type: object
      required:
        - playerId
        - playerName
        - ftMade
        - ftAttempted
        - twoMade
        - twoAttempted
        - threeMade
        - threeAttempted
        - points
        - assists
        - rebounds
        - steals
        - turnovers
        - blocks
      properties:
        playerId: { type: integer }
        playerName: { type: string }
        ftMade: { type: integer }
        ftAttempted: { type: integer }
        twoMade: { type: integer }
        twoAttempted: { type: integer }
        threeMade: { type: integer }
        threeAttempted: { type: integer }
        points: { type: integer }
        assists: { type: integer }
        rebounds: { type: integer }
        steals: { type: integer }
        turnovers: { type: integer }
        blocks: { type: integer }
        goals: { type: integer, default: 0 }
        shots: { type: integer, default: 0 }
        shotsOffTarget: { type: integer, default: 0 }
        saves: { type: integer, default: 0 }
        yellowCards: { type: integer, default: 0 }
        redCards: { type: integer, default: 0 }

    PlayerGameStatInput:
      type: object
      required:
        - playerId
        - ftMade
        - ftAttempted
        - twoMade
        - twoAttempted
        - threeMade
        - threeAttempted
        - assists
        - rebounds
        - steals
        - turnovers
        - blocks
      properties:
        playerId: { type: integer }
        ftMade: { type: integer, minimum: 0 }
        ftAttempted: { type: integer, minimum: 0 }
        twoMade: { type: integer, minimum: 0 }
        twoAttempted: { type: integer, minimum: 0 }
        threeMade: { type: integer, minimum: 0 }
        threeAttempted: { type: integer, minimum: 0 }
        assists: { type: integer, minimum: 0 }
        rebounds: { type: integer, minimum: 0 }
        steals: { type: integer, minimum: 0 }
        turnovers: { type: integer, minimum: 0 }
        blocks: { type: integer, minimum: 0 }
        goals: { type: integer, minimum: 0, default: 0 }
        shots: { type: integer, minimum: 0, default: 0 }
        shotsOffTarget: { type: integer, minimum: 0, default: 0 }
        saves: { type: integer, minimum: 0, default: 0 }
        yellowCards: { type: integer, minimum: 0, default: 0 }
        redCards: { type: integer, minimum: 0, default: 0 }

    Game:
      type: object
      required:
        - id
        - teamId
        - teamName
        - opponent
        - date
        - result
        - teamScore
        - opponentScore
        - createdAt
        - stats
        - events
      properties:
        id: { type: integer }
        teamId: { type: integer }
        teamName: { type: string }
        opponent: { type: string }
        date: { type: string, format: date }
        result: { type: string, enum: [W, L] }
        teamScore: { type: integer }
        opponentScore: { type: integer }
        videoObjectPath: { type: string, nullable: true }
        videoOffsetMs: { type: integer, nullable: true }
        videoDurationMs:
          type: integer
          nullable: true
          description: True end of the recorded footage in video-timeline ms, probed from the stored file. Events after this point happened after the recording stopped and are not on film.
        videoHalf2StartMs:
          type: integer
          nullable: true
          description: Recording-clock timestamp where the second half begins, for repaired two-half videos. Null for single continuous recordings.
        videoHalftimeGapMs:
          type: integer
          nullable: true
          description: Length of the halftime gap that was removed when the two halves were stitched. Second-half event timestamps must subtract this to map onto the stitched video timeline.
        highlightObjectPath: { type: string, nullable: true }
        highlightStatus:
          type: string
          nullable: true
          enum: [idle, processing, ready, failed]
        highlightError: { type: string, nullable: true }
        videoProcessing:
          type: boolean
          description: True when the game has a video but its playback proxy is not yet ready (still being optimised). Disappears once the proxy build completes.
        createdAt: { type: string, format: date-time }
        stats:
          type: array
          items:
            $ref: "#/components/schemas/PlayerGameStatLine"
        events:
          type: array
          items:
            $ref: "#/components/schemas/GameEvent"

    MergeGamesInput:
      type: object
      required: [primaryGameId, secondaryGameIds]
      properties:
        primaryGameId:
          type: integer
          description: The game that will absorb all others and keep its date/opponent.
        secondaryGameIds:
          type: array
          items: { type: integer }
          minItems: 1
          maxItems: 9
          description: Games to merge into the primary (hidden after merge, not deleted).

    GameInput:
      type: object
      required: [teamId, opponent, date, result, teamScore, opponentScore, stats, events]
      properties:
        teamId: { type: integer }
        opponent: { type: string, minLength: 1 }
        date: { type: string, format: date }
        result: { type: string, enum: [W, L] }
        teamScore: { type: integer, minimum: 0 }
        opponentScore: { type: integer, minimum: 0 }
        videoObjectPath: { type: string, nullable: true }
        stats:
          type: array
          items:
            $ref: "#/components/schemas/PlayerGameStatInput"
        events:
          type: array
          items:
            $ref: "#/components/schemas/GameEvent"

    GameUpdate:
      type: object
      required: [teamId, opponent, date, result, teamScore, opponentScore, stats, events]
      properties:
        teamId: { type: integer }
        opponent: { type: string, minLength: 1 }
        date: { type: string, format: date }
        result: { type: string, enum: [W, L] }
        teamScore: { type: integer, minimum: 0 }
        opponentScore: { type: integer, minimum: 0 }
        videoObjectPath: { type: string, nullable: true }
        videoOffsetMs: { type: integer, nullable: true }
        stats:
          type: array
          items:
            $ref: "#/components/schemas/PlayerGameStatInput"
        events:
          type: array
          items:
            $ref: "#/components/schemas/GameEvent"

    ImportGameRow:
      type: object
      required: [teamName, opponent, date, result, teamScore, opponentScore, playerName, ftMade, ftAttempted, twoMade, twoAttempted, threeMade, threeAttempted, assists, rebounds, steals, turnovers, blocks]
      properties:
        teamName: { type: string }
        opponent: { type: string }
        date: { type: string }
        result: { type: string, enum: [W, L] }
        teamScore: { type: integer }
        opponentScore: { type: integer }
        playerName: { type: string }
        ftMade: { type: integer }
        ftAttempted: { type: integer }
        twoMade: { type: integer }
        twoAttempted: { type: integer }
        threeMade: { type: integer }
        threeAttempted: { type: integer }
        assists: { type: integer }
        rebounds: { type: integer }
        steals: { type: integer }
        turnovers: { type: integer }
        blocks: { type: integer }

    ImportInput:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportGameRow"

    ImportResult:
      type: object
      required: [playersCreated, teamsCreated, gamesCreated, statLinesCreated]
      properties:
        playersCreated: { type: integer }
        teamsCreated: { type: integer }
        gamesCreated: { type: integer }
        statLinesCreated: { type: integer }

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `video/webm`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    BillingStatus:
      type: object
      required: [plan, status, cancelAtPeriodEnd]
      properties:
        plan:
          type: string
          enum: [free, pro, premium]
          description: Effective plan derived from Stripe subscription status.
        status:
          type: string
          nullable: true
          description: Raw Stripe subscription status (e.g. trialing, active, past_due, canceled), or null if never subscribed.
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        trialEnd:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        hasSoccer:
          type: boolean
          default: false

    CreateCheckoutSessionInput:
      type: object
      required: [interval]
      properties:
        interval:
          type: string
          enum: [month, year]
          description: Billing interval.
        tier:
          type: string
          enum: [pro, premium, soccer]
          description: Which plan tier to check out with. Defaults to pro.

    CheckoutSessionResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Stripe-hosted Checkout URL to redirect the user to.

    PortalSessionResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Stripe-hosted Billing Portal URL to redirect the user to.

    HighlightStatus:
      type: object
      required: [status, eligibleMoments]
      properties:
        status:
          type: string
          enum: [idle, processing, ready, failed]
        highlightObjectPath: { type: string, nullable: true }
        error: { type: string, nullable: true }
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: When the current/most-recent generation run started — used by the client to estimate progress while status is "processing".
        eligibleMoments:
          type: integer
          description: Number of qualifying moments (made shots, rebounds, assists, steals, blocks).
        onFilmMoments:
          type: integer
          nullable: true
          description: How many of the eligible moments occurred while the camera was still recording. Null when the video duration is unknown.
        musicTrack:
          type: string
          nullable: true
          description: Music track ID used during the most recent reel generation (e.g. "energetic"). Null means no music was used.
        youtubeUrl:
          type: string
          nullable: true
          description: YouTube video URL if the highlight reel has been uploaded. Null when the reel has not been uploaded yet.

    LowlightStatus:
      type: object
      required: [status, eligibleMoments]
      properties:
        status:
          type: string
          enum: [idle, processing, ready, failed]
        lowlightObjectPath: { type: string, nullable: true }
        error: { type: string, nullable: true }
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: When the current/most-recent generation run started.
        eligibleMoments:
          type: integer
          description: Number of qualifying moments (missed shots and turnovers).
        onFilmMoments:
          type: integer
          nullable: true
          description: How many of the eligible moments occurred while the camera was still recording. Null when the video duration is unknown.
        musicTrack:
          type: string
          nullable: true
          description: Music track ID used during the most recent reel generation (e.g. "energetic"). Null means no music was used.

    GameEvent:
      type: object
      required: [playerId, statField, delta, videoTimestampMs]
      properties:
        playerId: { type: integer }
        statField: { type: string }
        delta: { type: integer }
        videoTimestampMs: { type: integer, minimum: 0 }
