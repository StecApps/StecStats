name: Build and submit iOS to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - task-735-release-sync

permissions:
  contents: read

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: EAS production build and TestFlight submission
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install --global eas-cli@21.7.1

      - name: Verify Expo authentication
        working-directory: artifacts/hoops-mobile
        run: eas whoami

      - name: Build and submit to TestFlight
        working-directory: artifacts/hoops-mobile
        run: eas build --platform ios --profile production --non-interactive --auto-submit